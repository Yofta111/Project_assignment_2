<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puppies</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="puppy-body">
    <section class="puppy-container">
        <header class="puppy-header">
            <h1 class="puppy-header-title">Puppy lovers page</h1>
        </header>
        <div class="puppy-banner-wrapper">
            <img class="puppy-banner-img" src="banner-puppies.jpg" alt="">
        </div>
        <div class="puppy-middle-row">
            <img class="puppy-img-left" src="puppy-1.jpg" alt="">
            <div class="puppy-missing-box">
                <p class="puppy-missing-text">Puppy Missing here!!</p>
            </div>
            <img class="puppy-img-right" src="puppy-2.jpg" alt="">
        </div>
        <h1 class="puppy-more-heading"><b>More Puppies</b></h1>
        <div class="puppy-gallery-row">
            <img class="puppy-gallery-img-first" src="puppy-3.jpg" alt="">
            <img class="puppy-gallery-img-second" src="puppy-4.jpg" alt="">
        </div>
        <footer class="puppy-footer">
            <h1 class="puppy-footer-text">Developed By: Yoftahe Araya</h1>
        </footer>
    </section>
</body>
</html>
